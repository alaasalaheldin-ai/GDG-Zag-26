<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Quote of the day </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quote-box">
        <h2> Quote of the day </h2>
        <blockquote id="quote">Loading...</blockquote>
        <span id="author">Loading...</span>
        <div>
            <button onclick="getquote(api_url)" >New Quote</button>
            <button onclick="tweetQuote()"><img src="Twitter logo on dark background.png">Tweet
            </button>
        </div>
    </div>
    <script>
        const quote = document.getElementById("quote");
        const author = document.getElementById("author");
        const api_url = "https://dummyjson.com/quotes/random";

    async function getquote(){
    const res = await fetch(api_url);
    const data = await res.json();

    console.log(data.quote);   
    console.log(data.author);  
    quote.innerHTML = data.quote;
    author.innerHTML = data.author;
}

getquote(api_url);

function tweetQuote(){
    window.open("https://twitter.com/intent/tweet?text=" + quote.innerHTML + " ---- by" + author.innerHTML ,
    "Tweet Window" , "widtth=600" , "height=300");
}

    </script>
</body>
</html>
